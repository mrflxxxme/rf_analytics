[project]
name = "rf-api"
version = "0.1.0"
description = "RADAR API: витрины snapshot и query-spec поверх семантического слоя"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_api"]

[tool.pytest.ini_options]
testpaths = ["../tests/api"]
