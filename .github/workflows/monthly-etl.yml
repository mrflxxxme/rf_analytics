name: monthly-etl

# Ежемесячный ETL (docs/01-architecture.md, D17, D34): реестр МСП ФНС → компактные снимки →
# витрины фактов; Росстат → region_profile (T1.8) → manifest.json → rsync на сервер в /opt/rf-analytics/marts/<snapshot> + current.
# Тесты и region_profile (лёгкий, ~2 МБ скачивания) — на каждый PR. Тяжёлый прогон МСП — по расписанию, вручную или по метке PR `run-etl`
# (с PR витрины на сервер не публикуются).
on:
  schedule:
    - cron: "0 3 14 * *"  # снимок реестра выходит 10-го; 14-го 06:00 МСК
  workflow_dispatch:
    inputs:
      spec:
        description: "annual | latest | YYYY-MM,YYYY-MM"
        default: annual
      publish:
        description: "Опубликовать snapshot на сервер"
        type: boolean
        default: true
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - etl/**
      - tests/etl/**
      - config/taxonomy.yaml
      - config/geo/regions.csv
      - config/sources.yaml
      - config/certs/**
      - deploy/publish-snapshot.sh
      - deploy/fetcher/**
      - .github/workflows/monthly-etl.yml

permissions:
  contents: read

# opened + labeled на один коммит дают два запуска — тяжёлая матрица идёт один раз.
# Посторонняя метка получает свою группу и ничего не отменяет; dispatch с другим spec — тоже.
concurrency:
  group: monthly-etl-${{ github.ref }}-${{ inputs.spec || github.event_name }}${{ github.event.action == 'labeled' && github.event.label.name != 'run-etl' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  UV_PROJECT: etl

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --project etl --frozen
      - run: uv run --project etl pytest -q tests/etl

  profile:
    # Росстат открыт с зарубежных IP (docs/08-source-probe.md) — качаем прямо в Actions.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --project etl rf-etl rosstat-fetch --out-dir raw/rosstat > /dev/null
      - run: uv run --project etl rf-etl region-profile --raw-dir raw/rosstat --out-dir marts | tee profile.json
      - name: Summary
        run: |
          {
            echo '### region_profile'; echo '```json'; cat profile.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: region-profile
          path: marts/
          retention-days: 90

  plan:
    needs: test
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'run-etl') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-etl'))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.v.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - id: v
        run: |
          m=$(uv run --project etl rf-etl rsmp-versions --spec "${{ inputs.spec || 'annual' }}")
          echo "$m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"

  parse:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        snap: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --project etl rf-etl rsmp-parse --url "${{ matrix.snap.url }}" --out-dir slim
      - uses: actions/upload-artifact@v4
        with:
          name: rsmp-slim-${{ matrix.snap.date }}
          path: slim/rsmp_*
          retention-days: 30

  marts:
    needs: parse
    # Только полная матрица: пропущенный снимок молча выбил бы годы из роста и выживаемости.
    # Упавшие снимки — «Re-run failed jobs», marts пересоберётся.
    if: needs.parse.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: rsmp-slim-*
          path: slim
          merge-multiple: true
      - run: uv run --project etl rf-etl rsmp-marts --slim-dir slim --out-dir marts
      - name: Summary
        run: |
          {
            echo '### monthly-etl'; echo '```json'; cat marts/report.json; echo '```'
            echo '#### parse stats'; echo '```'; cat slim/*.stats.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: marts
          overwrite: true
          path: |
            marts/
            slim/*.stats.json
          retention-days: 90

  publish:
    needs: [marts, profile]
    if: >-
      needs.marts.result == 'success' && needs.profile.result == 'success' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    concurrency: publish-marts  # два прогона не переключают current одновременно
    env:
      SERVER: root@194.87.187.207
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: marts
          path: art
      - uses: actions/download-artifact@v4
        with:
          name: region-profile
          path: art/marts
      - name: SSH
        env:
          SSH_KEY: ${{ secrets.RF_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.RF_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host 194.87.187.207\n  IdentityFile ~/.ssh/id_deploy\n  BatchMode yes\n  ConnectTimeout 30\n' > ~/.ssh/config
      - name: rsync raw с сервера (то, что скачал fetcher)
        run: rsync -a --exclude '*.part' "$SERVER:/opt/rf-analytics/raw/" raw/
      - name: manifest.json
        id: m
        run: |
          sid=$(uv run --project etl rf-etl manifest --marts-dir art/marts --slim-dir art/slim \
                --raw-dir raw --git-sha "$GITHUB_SHA")
          echo "snapshot=$sid" >> "$GITHUB_OUTPUT"
      - name: rsync витрин и переключение current
        env:
          SNAP: ${{ steps.m.outputs.snapshot }}
        run: |
          ssh "$SERVER" "install -d -m 755 /opt/rf-analytics/marts/.incoming"
          rsync -a --delete art/marts/ "$SERVER:/opt/rf-analytics/marts/.incoming/$SNAP/"
          ssh "$SERVER" "SNAP=$SNAP bash -s" < deploy/publish-snapshot.sh | tee publish.log
          {
            echo "### snapshot \`$SNAP\`"; echo '```'; cat publish.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
