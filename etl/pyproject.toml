[project]
name = "rf-etl"
version = "0.1.0"
description = "RADAR ETL: открытые данные → витрины измеренных фактов"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "lxml>=5.3",
  "markdown>=3.7",
  "openpyxl>=3.1",
  "pyarrow>=17",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[project.scripts]
rf-etl = "rf_etl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_etl"]

[tool.pytest.ini_options]
testpaths = ["../tests/etl"]
