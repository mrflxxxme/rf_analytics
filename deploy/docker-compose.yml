# Стек RADAR на 194.87.187.207 (docs/01-architecture.md, «Деплой на сервер»).
# Каталог /opt/rf-analytics, порты не публикуются, вход только через edge-caddy по сети edge.
name: rf-analytics

services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: rf-analytics-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro
    networks: [edge, internal]
    cpus: 0.25
    mem_limit: 64m
    # Харденинг как у edge-caddy: ФС только на чтение; NET_BIND_SERVICE оставлен —
    # бинарь caddy несёт file capability, без неё exec падает.
    read_only: true
    tmpfs: [/tmp, /data, /config]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  # API (T2.1): FastAPI + DuckDB read-only над marts/current. Образ собирает и грузит deploy-stack.yml
  # (docker save | ssh docker load), реестра нет. В edge не входит: доступ только через свой caddy.
  api:
    image: rf-analytics-api:current
    pull_policy: never
    container_name: rf-analytics-api
    restart: unless-stopped
    volumes:
      - ./marts:/marts:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 1.0
    mem_limit: 512m

  # Ночной скачиватель гео-блокируемых источников (D17). Только сеть и диск, в edge не входит.
  # Ручной проход: docker compose -p rf-analytics run --rm fetcher python -u /app/fetch.py --once
  fetcher:
    image: python:3.12.7-alpine
    container_name: rf-analytics-fetcher
    restart: unless-stopped
    command: ["python", "-u", "/app/fetch.py"]
    environment:
      RF_FETCH_AT: "00:30"
    volumes:
      - ./fetcher:/app:ro
      - ./raw:/raw
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m

networks:
  edge:
    external: true
  internal:
    internal: true  # caddy ↔ api, без выхода наружу
