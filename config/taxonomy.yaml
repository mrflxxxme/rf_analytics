# Таксономия потребностей RADAR (T1.7, D4, D24, D31). ЧЕРНОВИК — до утверждения автором.
#
# id (need_id) — стабильный публичный идентификатор (D31): после публикации не
# переименовывается и не переиспользуется. Меняется только name. Снятая
# потребность получает status: retired и остаётся в файле.
#
# okved — префиксы кодов ОКВЭД2 (основной вид деятельности в реестре МСП):
# "56.10" включает 56.10 и все 56.10.x. Пересечение кодов между потребностями
# запрещено (тест), пока у кода нет явной доли (поле okved_share, п. 1 03-methodology.md).
# Критерий D24: есть франчайзинг × измеримо через ОКВЭД и поиск × хватает событий.
# min_entities_rf — порог активных субъектов МСП по РФ; проверяется по витрине ETL.

version: 0.1.0
status: draft
